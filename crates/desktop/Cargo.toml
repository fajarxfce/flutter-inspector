[package]
name = "flutter-inspector"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
inspector-domain.workspace = true
inspector-application.workspace = true
inspector-adapters.workspace = true
serde_json.workspace = true
uuid.workspace = true
eframe = { version = "=0.36.2", default-features = false, features = ["glow","default_fonts","wayland","x11","accesskit"] }
egui_extras = "=0.36.2"
base64 = "0.22"
rfd = "0.15"
walkers = "=0.60.0"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

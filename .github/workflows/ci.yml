name: Verify and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify build tooling
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xdotool xclip imagemagick tesseract-ocr
      - name: Software OpenGL for headless Linux UI checks
        if: runner.os == 'Linux'
        run: echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release -p flutter-inspector --locked
      - name: Native UI smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python3 tools/smoke_ui.py
      - name: GPS UI and helper protocol
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1100x24' python3 tools/gps_ui.py target/release/flutter-inspector
      - name: Network and multi-tab Repeater UI
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python3 tools/repeater_ui.py target/release/flutter-inspector
      - name: Android date and time utility UI
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python3 tools/device_clock_ui.py target/release/flutter-inspector
      - name: Android app manager UI
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1100x24' python3 tools/android_apps_ui.py target/release/flutter-inspector
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: linux-smoke
          path: |
            artifacts/smoke/
            artifacts/repeater-ui/
            artifacts/gps-ui/
            artifacts/device-clock-ui/
            artifacts/android-apps-ui/
  dart:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb libegl1 libgl1-mesa-dri
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed packages examples/flutter_fixture/lib examples/gps_fixture/lib
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: packages/flutter_inspector_bridge
      - run: dart test
        working-directory: packages/flutter_inspector_dio
      - run: dart test
        working-directory: packages/flutter_inspector_drift
      - run: flutter test
        working-directory: packages/flutter_inspector_preferences
      - run: cargo test -p inspector-adapters --test vm_bridge -- --ignored
      - name: Verify release guard
        run: |
          mkdir -p artifacts
          dart compile exe packages/flutter_inspector_bridge/test/fixtures/release_probe.dart -o artifacts/release-probe
          ./artifacts/release-probe
      - run: flutter build linux --debug
        working-directory: examples/flutter_fixture
      - name: Built-in inspectors without bridge
        run: xvfb-run -a cargo test -p inspector-adapters --test native_vm -- --ignored
  preview:
    name: Publish latest preview
    needs: [native, dart]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: latest-preview-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify packages and publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_preview.py --assets release-assets
